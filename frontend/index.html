<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgendaFlow</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

    <header class="cabecalho">

        <div>
            <h1>AgendaFlow</h1>
            <p>Organize suas atividades e seu tempo.</p>
        </div>

    </header>


    <main class="container">

        <section class="painel-formulario">

            <h2>Nova atividade</h2>

            <form id="form-atividade">

                <div class="campo">

                    <label for="titulo">
                        Título
                    </label>

                    <input type="text" id="titulo" name="titulo" required minlength="3" maxlength="120">

                </div>


                <div class="campo">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea id="descricao" name="descricao" rows="3"></textarea>

                </div>


                <div class="linha-formulario">

                    <div class="campo">

                        <label for="categoria">
                            Categoria
                        </label>

                        <select id="categoria" name="categoria">
                            <option value="Pessoal">
                                Pessoal
                            </option>

                            <option value="Trabalho">
                                Trabalho
                            </option>

                            <option value="Mestrado">
                                Mestrado
                            </option>

                            <option value="Aula">
                                Aula
                            </option>

                            <option value="Tutoria">
                                Tutoria
                            </option>
                        </select>

                    </div>


                    <div class="campo">

                        <label for="prioridade">
                            Prioridade
                        </label>

                        <select id="prioridade" name="prioridade">
                            <option value="baixa">
                                Baixa
                            </option>

                            <option value="media" selected>
                                Média
                            </option>

                            <option value="alta">
                                Alta
                            </option>
                        </select>

                    </div>

                </div>


                <div class="linha-formulario">

                    <div class="campo">

                        <label for="data">
                            Data
                        </label>

                        <input type="date" id="data" name="data" required>

                    </div>


                    <div class="campo">

                        <label for="hora_inicio">
                            Início
                        </label>

                        <input type="time" id="hora_inicio" name="hora_inicio" required>

                    </div>


                    <div class="campo">

                        <label for="hora_fim">
                            Fim
                        </label>

                        <input type="time" id="hora_fim" name="hora_fim">

                    </div>

                </div>
                <div class="campo-recorrencia">

                    <label class="checkbox-recorrencia">

                        <input type="checkbox" id="recorrente">

                        Repetir esta atividade

                    </label>


                    <div id="painel-recorrencia" class="painel-recorrencia" hidden>

                        <div class="campo">

                            <label for="tipo_recorrencia">
                                Frequência
                            </label>

                            <select id="tipo_recorrencia">

                                <option value="">
                                    Selecione
                                </option>

                                <option value="diaria">
                                    Diariamente
                                </option>

                                <option value="semanal">
                                    Semanalmente
                                </option>

                            </select>

                        </div>


                        <div id="grupo-dias-semana" class="grupo-dias-semana" hidden>

                            <span class="rotulo-dias">
                                Dias da semana
                            </span>


                            <div class="dias-semana">

                                <label>
                                    <input type="checkbox" name="dias_semana" value="segunda">
                                    Seg
                                </label>

                                <label>
                                    <input type="checkbox" name="dias_semana" value="terca">
                                    Ter
                                </label>

                                <label>
                                    <input type="checkbox" name="dias_semana" value="quarta">
                                    Qua
                                </label>

                                <label>
                                    <input type="checkbox" name="dias_semana" value="quinta">
                                    Qui
                                </label>

                                <label>
                                    <input type="checkbox" name="dias_semana" value="sexta">
                                    Sex
                                </label>

                                <label>
                                    <input type="checkbox" name="dias_semana" value="sabado">
                                    Sáb
                                </label>

                                <label>
                                    <input type="checkbox" name="dias_semana" value="domingo">
                                    Dom
                                </label>

                            </div>

                        </div>


                        <div class="campo">

                            <label for="data_fim_recorrencia">
                                Repetir até
                            </label>

                            <input type="date" id="data_fim_recorrencia">

                        </div>

                    </div>

                </div>

                <button type="submit" id="botao-salvar" class="botao-principal">
                    Adicionar atividade
                </button>

                <button type="button" id="botao-cancelar-edicao" class="botao-secundario" hidden>
                    Cancelar edição
                </button>


                <p id="mensagem" class="mensagem"></p>

            </form>

        </section>


        <section class="painel-atividades">

            <div class="titulo-secao">

                <div>
                    <h2>Agenda semanal</h2>

                    <p>
                        Visualize a distribuição das suas atividades durante a semana.
                    </p>
                </div>

                <span id="contador-atividades">
                    0 atividades
                </span>

            </div>
            <div class="filtros">

                <div class="filtro">

                    <label for="filtro-categoria">
                        Categoria
                    </label>

                    <select id="filtro-categoria">

                        <option value="">
                            Todas
                        </option>

                        <option value="Pessoal">
                            Pessoal
                        </option>

                        <option value="Trabalho">
                            Trabalho
                        </option>

                        <option value="Mestrado">
                            Mestrado
                        </option>

                        <option value="Aula">
                            Aula
                        </option>

                        <option value="Tutoria">
                            Tutoria
                        </option>

                    </select>

                </div>


                <div class="filtro">

                    <label for="filtro-prioridade">
                        Prioridade
                    </label>

                    <select id="filtro-prioridade">

                        <option value="">
                            Todas
                        </option>

                        <option value="baixa">
                            Baixa
                        </option>

                        <option value="media">
                            Média
                        </option>

                        <option value="alta">
                            Alta
                        </option>

                    </select>

                </div>


                <div class="filtro">

                    <label for="filtro-status">
                        Status
                    </label>

                    <select id="filtro-status">

                        <option value="todas">
                            Todas
                        </option>

                        <option value="pendentes">
                            Pendentes
                        </option>

                        <option value="concluidas">
                            Concluídas
                        </option>

                    </select>

                </div>


                <button type="button" id="limpar-filtros" class="botao-limpar-filtros">
                    Limpar filtros
                </button>

            </div>

            <section class="agenda-semanal">

                <div class="agenda-toolbar">

                    <button type="button" id="semana-anterior" class="botao-navegacao" aria-label="Semana anterior">
                        ←
                    </button>


                    <div class="periodo-semana">

                        <strong id="periodo-semana">
                            Semana atual
                        </strong>

                    </div>


                    <button type="button" id="semana-atual" class="botao-navegacao">
                        Hoje
                    </button>


                    <button type="button" id="semana-proxima" class="botao-navegacao" aria-label="Próxima semana">
                        →
                    </button>

                </div>


                <div class="agenda-scroll">

                    <div id="agenda-semana">
                    </div>

                </div>

            </section>


            <div class="titulo-lista">

                <div>
                    <h2>Atividades cadastradas</h2>

                    <p>
                        Use os controles abaixo para editar, concluir ou excluir.
                    </p>
                </div>

            </div>


            <div id="lista-atividades" class="lista-atividades">
            </div>

        </section>

    </main>


    <script src="/static/js/app.js"></script>

</body>

</html>
